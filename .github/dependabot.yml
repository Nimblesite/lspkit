version: 2
# Keeps SHA-pinned actions and every dependency graph fresh without burning CI
# on `main`. EVERY bump lands on the `dependabot-upgrades` staging branch:
# version PRs target it directly, and dependabot-automerge.yml sweeps security
# PRs (which GitHub always opens against `main`) into it too. ci.yml and
# codeql.yml skip Dependabot PRs, so the batch reaches `main` through ONE
# consolidation PR where CI runs once. Each language ecosystem collapses all
# version bumps into one group and all security bumps into a `*-security`
# group. A 7-day cooldown keeps a freshly published (possibly hijacked)
# release out until the ecosystem has had a week to flag it.
# [REL-DEPENDABOT] [GITHUB-DEPENDABOT] [SWR-SEC-ACTION-PINNING]
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /packages/lsp-profiler-ui
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /dotnet
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      nuget:
        applies-to: version-updates
        patterns: ["*"]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
