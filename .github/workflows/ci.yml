# agent-pmo:74cf183
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: read-only token; no job needs write here.
# [SWR-SEC-TOKEN-PRIVILEGE]
permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-22.04-8-cores
    timeout-minutes: 15
    steps:
      # All third-party actions are pinned to a full commit SHA (mutable tags
      # are FAIL); dependabot keeps the pins fresh. [SWR-SEC-ACTION-PINNING]
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      # The profiler's .NET engine and the fixture its e2e tests profile build in
      # `make test` (net8.0, rolled forward to this SDK's runtime). [PROF-TESTING]
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # crates/lsp-profiler/build.rs generates the wire model from
      # docs/models/profiler.td with typeDiagram. [PROF-WIRE-GEN]
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install typeDiagram
        run: npm install -g typediagram@0.11.0

      # Rust-aware cache: registry + git + target/ with built-in restore-keys,
      # rustc-version-aware key, and target/ cleanup before save (avoids bloat).
      # Survives Cargo.toml dev-dep changes via partial restore, unlike the
      # previous hashFiles(**/Cargo.toml) key.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          # Cache the workspace across all steps in this job; key already
          # includes rustc version + Cargo.lock hash via the action defaults.
          shared-key: ci

      # Prebuilt binaries via taiki-e/install-action — seconds vs. minutes
      # compared to `cargo install --locked` building from source.
      - name: Install cargo-llvm-cov + cargo-nextest
        uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154 # v2.81.8
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # fmt, lint, test are three separate, non-overlapping steps.
      - name: Format check
        run: make fmt CHECK=1

      - name: Lint
        run: make lint

      # make test = fail-fast + coverage + threshold enforcement.
      # Thresholds live in coverage-thresholds.json.
      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
          retention-days: 7

      - name: Build
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts
          path: |
            target/release/
          retention-days: 7
