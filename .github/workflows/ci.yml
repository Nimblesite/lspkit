# agent-pmo:74cf183
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: read-only token; no job needs write here.
# [SWR-SEC-TOKEN-PRIVILEGE]
permissions:
  contents: read

jobs:
  ci:
    name: CI
    # Public repositories can use standard runners without larger-runner charges.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # All third-party actions are pinned to a full commit SHA (mutable tags
      # are FAIL); dependabot keeps the pins fresh. [SWR-SEC-ACTION-PINNING]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      # The profiler's .NET engine and the fixture its e2e tests profile build in
      # `make test` (net8.0, rolled forward to this SDK's runtime). [PROF-TESTING]
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # crates/lsp-profiler/build.rs generates the wire model from
      # docs/models/profiler.td with typeDiagram. [PROF-WIRE-GEN]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install typeDiagram
        run: npm install -g typediagram@0.11.0

      # Rust-aware cache: registry + git + target/ with built-in restore-keys,
      # rustc-version-aware key, and target/ cleanup before save (avoids bloat).
      # Survives Cargo.toml dev-dep changes via partial restore, unlike the
      # previous hashFiles(**/Cargo.toml) key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # Cache the workspace across all steps in this job; key already
          # includes rustc version + Cargo.lock hash via the action defaults.
          shared-key: ci

      # Prebuilt binaries via taiki-e/install-action — seconds vs. minutes
      # compared to `cargo install --locked` building from source.
      - name: Install cargo-llvm-cov + cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # fmt, lint, test are three separate, non-overlapping steps.
      - name: Format check
        run: make fmt CHECK=1

      - name: Profiler source path regressions
        run: |
          npm ci --prefix packages/lsp-profiler-ui
          npm run build --prefix packages/lsp-profiler-ui
          npm run test:paths --prefix packages/lsp-profiler-ui

      - name: Lint
        run: make lint

      # make test = fail-fast + coverage + threshold enforcement.
      # Thresholds live in coverage-thresholds.json.
      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
          retention-days: 7

      - name: Build
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: |
            target/release/
          retention-days: 7
