name: supply-chain

# Vulnerability + license gate across the dependency graph. [SWR-SEC-VULN-GATE]
# Runs on PRs to `main` and on a weekly schedule to catch newly disclosed
# advisories; release.yml re-runs cargo-deny on the tagged SHA before it
# publishes. Pushes to `main` trigger nothing. [REL-REGIME] [CI-WORKFLOWS]
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. [SWR-SEC-TOKEN-PRIVILEGE]
permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories + licenses + bans + sources)
    # Dependabot PRs are swept into `dependabot-upgrades`. [GITHUB-DEPENDABOT]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  osv-scanner:
    name: osv-scanner (Cargo.lock + npm lockfiles)
    # Dependabot PRs are swept into `dependabot-upgrades`. [GITHUB-DEPENDABOT]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      # The scanner action lives in the repo's osv-scanner-action/ directory; the
      # repository root holds only reusable workflows.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=packages/lsp-profiler-ui/package-lock.json

  # Workflow static analysis: unpinned actions, over-broad tokens, template
  # injection, cache poisoning, spoofable bot checks. Same settings as
  # Shipwright's lint-supply-chain.yml. [SWR-GATE-ACTION-PINNING] [SWR-GATE-TOKEN-PRIVILEGE]
  zizmor:
    name: zizmor (workflow static analysis)
    # Dependabot PRs are swept into `dependabot-upgrades`. [GITHUB-DEPENDABOT]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: pedantic
          min-severity: medium
          # No advisory upload: the gate stays read-only.
          advanced-security: false
          online-audits: false
