[workspace]
resolver = "2"
members = [
    "crates/lspkit",
    "crates/lspkit-server",
    "crates/lspkit-vfs",
    "crates/lspkit-live",
    "crates/lspkit-mcp",
    "crates/lspkit-config",
    "crates/lspkit-treesitter",
    "crates/lspkit-sidecar",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nimblesite/lsp_toolkit"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[workspace.dependencies]
# Async runtime + utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "process", "time", "net"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-core = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# LSP protocol types (maintained; we ship our own server loop)
lsp-types = "0.97"

# MCP SDK
rmcp = "0.2"

# Document / state
dashmap = "6"
ropey = "1"

# Filesystem
notify = "7"

# Errors / tracing
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Tree-sitter (optional, in lspkit-treesitter only)
tree-sitter = "0.25"

# Internal workspace dependencies
lspkit = { version = "0.0.1", path = "crates/lspkit" }
lspkit-server = { version = "0.0.1", path = "crates/lspkit-server" }
lspkit-vfs = { version = "0.0.1", path = "crates/lspkit-vfs" }
lspkit-live = { version = "0.0.1", path = "crates/lspkit-live" }
lspkit-mcp = { version = "0.0.1", path = "crates/lspkit-mcp" }
lspkit-config = { version = "0.0.1", path = "crates/lspkit-config" }
lspkit-treesitter = { version = "0.0.1", path = "crates/lspkit-treesitter" }
lspkit-sidecar = { version = "0.0.1", path = "crates/lspkit-sidecar" }
