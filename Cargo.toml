[workspace]
resolver = "2"
members = [
    "crates/lspkit",
    "crates/lspkit-server",
    "crates/lsp-profiler",
    "crates/lsp-profiler-dotnet",
]
# Parked profiler runtime: kept with the profiler, not built yet.
exclude = ["crates/lsp-profiler-python"]

[workspace.package]
version = "0.0.0-dev"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Nimblesite/lspkit"
# Inherited by every crate. `readme`/`keywords`/`categories` resolve relative to
# the workspace root and are packaged into each crate's tarball so crates.io
# renders them. [SWR-REL-CRATES]
readme = "README.md"
keywords = ["lsp", "mcp", "language-server", "tree-sitter", "json-rpc"]
categories = ["development-tools"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_imports = "deny"
dead_code = "deny"
unused_variables = "deny"
unused_mut = "deny"
unused_assignments = "deny"
unused_results = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
elided_lifetimes_in_paths = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
# Mirrors SharpLsp's workspace lints: lspkit is never less strict than a consumer.
# all + pedantic at maximum — restriction & nursery cherry-picked (contain contradictions)
all                  = { level = "deny", priority = -1 }
pedantic             = { level = "deny", priority = -1 }
unwrap_used          = "deny"
expect_used          = "deny"
panic                = "deny"
todo                 = "deny"
unimplemented        = "deny"
unreachable          = "deny"
missing_docs_in_private_items = "deny"
# Implicit panics from out-of-bounds indexing — use .get() instead
indexing_slicing     = "deny"
# Silent lossy type conversions via `as` — use .into()/.try_into() instead
as_conversions       = "deny"
# Forgotten debug macros leaking info to stderr
dbg_macro            = "deny"
# No raw stdout writes — an LSP server speaks JSON-RPC over stdio, so a stray
# `print!`/`println!` corrupts the protocol frame. Diagnostics MUST go through
# `tracing` (CLAUDE.md logging principle #1). This macro-only lint does not touch
# the framed writes lsp-server makes via io::stdout(), so protocol output is fine.
# NOTE: `print_stderr` is deliberately NOT denied — stderr is a separate stream
# inherited into the editor's log panel, and it is the correct last-resort sink
# for the pre-tracing bootstrap error in main.rs (before the subscriber exists)
# and for skip/status diagnostics in integration tests.
print_stdout         = "deny"
# Resource leaks from skipped destructors — use ManuallyDrop if needed
mem_forget           = "deny"
# From impls that can panic should be TryFrom instead
fallible_impl_from   = "deny"
# Catch needless implicit clones — use .clone() for explicit intent
implicit_clone       = "deny"
# Require SAFETY comments on any unsafe block — defense in depth for allowed exceptions
undocumented_unsafe_blocks = "deny"
# Prevent silent precision loss in float literals — critical for numeric type correctness
lossy_float_literal  = "deny"
# Prevent stack overflow from oversized local variables — critical for recursive AST walking
large_stack_frames   = "deny"
# Force #[expect] over #[allow] so stale lint suppressions don't hide new violations
allow_attributes     = "deny"
too_many_lines       = "deny"
too_many_arguments   = "deny"
cast_possible_truncation = "deny"
# Catch accidental infinite loops — require `-> !` return type for intentional ones
infinite_loop        = "deny"
# Prevent silent error cause discarding in .map_err(|_| ...) — preserve error provenance
map_err_ignore       = "deny"
# Prevent process::exit() — use proper error propagation, exit only via main() return
exit                 = "deny"
# Catch struct destructures that silently ignore new fields — critical during refactoring
rest_pat_in_fully_bound_structs = "deny"
# Require Arc::clone(&x) syntax — make ref-counted pointer cloning visually distinct
clone_on_ref_ptr     = "deny"
# Byte-range slicing of a `str` panics when an index is not a char boundary. An
# LSP slices source text on every position conversion, so the first document
# containing an accent, an emoji or a CJK character crashes the server. Use
# .get(), char_indices() or the UTF-16 conversion helpers instead.
string_slice         = "deny"
# CLAUDE.md: "Any function that can throw/panic must return Result<T,E>". A
# function that already returns Result and still panics inside defeats its own
# signature — the caller has error handling that never runs.
panic_in_result_fn   = "deny"
# Integer division truncates silently. Position math converts between UTF-8
# bytes and UTF-16 code units, so a truncated offset is an off-by-one that
# lands the cursor, a diagnostic or an edit on the wrong character.
integer_division     = "deny"

[workspace.dependencies]
# Async runtime + utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "process", "time", "net"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-core = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# LSP protocol types (maintained; we ship our own server loop)
lsp-types = "0.97"

# MCP SDK
rmcp = "3.5"

# Document / state
dashmap = "6"
ropey = "1"

# Filesystem
notify = "8"

# Config
toml = "1.1"

# Errors / tracing
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Profiler ([PROF-INVARIANTS]: only the core and runtime crates use these)
humantime = "2"
inferno = { version = "0.12", default-features = false }
num-traits = "0.2"
sysinfo = { version = "0.39.3", default-features = false, features = ["system", "user"] }
tempfile = "3"
url = "2"

# Tree-sitter (optional: the `treesitter` feature of lspkit)
tree-sitter = "0.27"

# Internal workspace dependencies.
# Versions are the `0.0.0-dev` placeholder; the release stamps the tag into
# both `[workspace.package].version` and these requirements. [SWR-VERSION-BUILD-STAMPING]
lspkit = { version = "0.0.0-dev", path = "crates/lspkit" }
lspkit-server = { version = "0.0.0-dev", path = "crates/lspkit-server" }
lsp-profiler = { version = "0.0.0-dev", path = "crates/lsp-profiler" }
lsp-profiler-dotnet = { version = "0.0.0-dev", path = "crates/lsp-profiler-dotnet" }
