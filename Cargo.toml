[workspace]
resolver = "2"
members = [
    "crates/lspkit",
    "crates/lspkit-server",
    "crates/lspkit-vfs",
    "crates/lspkit-live",
    "crates/lspkit-mcp",
    "crates/lspkit-config",
    "crates/lspkit-treesitter",
    "crates/lspkit-sidecar",
    "crates/lsp-profiler",
    "crates/lsp-profiler-dotnet",
]
# Parked profiler runtimes: kept with the profiler, not built yet.
exclude = ["crates/lsp-profiler-helper", "crates/lsp-profiler-python"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Nimblesite/lspkit"
# Inherited by every crate. `readme`/`keywords`/`categories` resolve relative to
# the workspace root and are packaged into each crate's tarball so crates.io
# renders them. [SWR-REL-CRATES]
readme = "README.md"
keywords = ["lsp", "mcp", "language-server", "tree-sitter", "json-rpc"]
categories = ["development-tools"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[workspace.dependencies]
# Async runtime + utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "process", "time", "net"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-core = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# LSP protocol types (maintained; we ship our own server loop)
lsp-types = "0.97"

# MCP SDK
rmcp = "3.5"

# Document / state
dashmap = "6"
ropey = "1"

# Filesystem
notify = "8"

# Errors / tracing
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Profiler ([PROF-INVARIANTS]: only the core and runtime crates use these)
humantime = "2"
inferno = { version = "0.12", default-features = false }
sysinfo = { version = "0.39.3", default-features = false, features = ["system", "user"] }
tempfile = "3"
url = "2"

# Tree-sitter (optional, in lspkit-treesitter only)
tree-sitter = "0.26"

# Internal workspace dependencies.
# Versions are the `0.0.0-dev` placeholder; the release stamps the tag into
# both `[workspace.package].version` and these requirements. [SWR-VERSION-BUILD-STAMPING]
lspkit = { version = "0.0.1", path = "crates/lspkit" }
lspkit-server = { version = "0.0.1", path = "crates/lspkit-server" }
lspkit-vfs = { version = "0.0.1", path = "crates/lspkit-vfs" }
lspkit-live = { version = "0.0.1", path = "crates/lspkit-live" }
lspkit-mcp = { version = "0.0.1", path = "crates/lspkit-mcp" }
lspkit-config = { version = "0.0.1", path = "crates/lspkit-config" }
lspkit-treesitter = { version = "0.0.1", path = "crates/lspkit-treesitter" }
lspkit-sidecar = { version = "0.0.1", path = "crates/lspkit-sidecar" }
lsp-profiler = { version = "0.0.1", path = "crates/lsp-profiler" }
lsp-profiler-dotnet = { version = "0.0.1", path = "crates/lsp-profiler-dotnet" }
