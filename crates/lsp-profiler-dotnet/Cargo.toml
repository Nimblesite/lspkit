[package]
name = "lsp-profiler-dotnet"
description = ".NET runtime for lsp-profiler: EventPipe CPU sampling and heap snapshots through the lsp-profiler-dotnet-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["profiler", "lsp", "flamegraph", "memory", "language-server"]
categories = ["development-tools::profiling"]
# Lean tarball: ship sources + the release-staged license only. LICENSE-MIT is
# gitignored (staged at publish time), so `include` forces it into the package.
# [PROF-WIRE-PACKAGED]
include = ["src/**/*", "LICENSE-MIT"]

# The profiler's own lint set, stricter than the lspkit workspace's
# ([PROF-INVARIANTS]): no unwrap, expect, panic, indexing or `as` casts.
[lints]
workspace = true

[dependencies]
async-trait.workspace = true
lsp-profiler.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
