[package]
name = "lsp-profiler"
description = "Language-neutral CPU and memory profiling engine for language servers: sample aggregation, hotspots, flame graphs, speedscope/V8 exports, heap snapshots, leak scoring, and one JSON-RPC protocol any editor can drive."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["profiler", "lsp", "flamegraph", "memory", "language-server"]
categories = ["development-tools::profiling"]
build = "build.rs"

# The profiler's own lint set, stricter than the lspkit workspace's
# ([PROF-INVARIANTS]): no unwrap, expect, panic, indexing or `as` casts.
[lints]
workspace = true

[dependencies]
async-trait.workspace = true
humantime.workspace = true
inferno.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
