[package]
name = "lspkit-live"
description = "File-watcher, debouncer, and single-flight scheduler that drive an EngineApi session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/lspkit-live"
# Lean tarball + force the release-staged (gitignored) LICENSE-MIT in. [SWR-REL-LICENSE]
include = ["src/**/*", "LICENSE-MIT"]

[lints]
workspace = true

[dependencies]
lspkit.workspace = true

tokio.workspace = true
tokio-util.workspace = true
notify.workspace = true
async-trait.workspace = true
futures-util.workspace = true

thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
futures-util.workspace = true
