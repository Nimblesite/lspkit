[package]
name = "lspkit-server"
description = "LSP server runtime on top of lspkit: Content-Length JSON-RPC framing, dispatcher, capabilities, diagnostics fan-out, progress, cancellation, a file-watching analysis scheduler and an optional MCP adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/lspkit-server"
# Lean tarball + force the release-staged (gitignored) LICENSE-MIT in. [SWR-REL-LICENSE]
# The example's support modules ship beside its entrypoint. [SWR-REL-EXAMPLE]
include = ["src/**/*", "examples/**/*.rs", "LICENSE-MIT"]

# The L1 toolkit crate: depends only on `lspkit`. [CRATE-LAYOUT-LAYERS]
[lints]
workspace = true

[dependencies]
lspkit.workspace = true

async-trait.workspace = true
futures-util.workspace = true
lsp-types.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

# Optional: the MCP SDK stays out of LSP-only consumers. [CRATE-LAYOUT-FEATURES]
rmcp = { workspace = true, optional = true }
salsa = { version = "0.28.5", optional = true }

[features]
mcp = ["dep:rmcp"]
pull = ["dep:salsa"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "io-std", "process", "test-util"] }
futures-core.workspace = true
futures-util.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

# Real reference pull-diagnostics server exercised by tests/diagnostic_reference.rs
# and its sibling suites; it needs the pull store, so a default-feature
# consumer build skips it instead of failing. [LSP-PULL-SALSA]
[[example]]
name = "diagnostic-reference"
required-features = ["pull"]
