[package]
name = "lspkit-server"
description = "Hand-rolled JSON-RPC LSP server scaffolding: Content-Length framing, dispatcher, capability builder, URI helpers, diagnostics fan-out, progress, cancellation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/lspkit-server"
# Lean tarball + force the release-staged (gitignored) LICENSE-MIT in. [SWR-REL-LICENSE]
# The example's support modules ship beside its entrypoint. [SWR-REL-EXAMPLE]
include = ["src/**/*", "examples/**/*.rs", "LICENSE-MIT"]

[lints]
workspace = true

[dependencies]
salsa = { version = "0.28.5", optional = true }
lspkit.workspace = true
lspkit-vfs.workspace = true

tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures-util.workspace = true

serde.workspace = true
serde_json.workspace = true
lsp-types.workspace = true

thiserror.workspace = true
tracing.workspace = true

[features]
pull = ["dep:salsa"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "io-std", "process"] }
futures-util.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tempfile = "3"
lspkit-live.workspace = true
lspkit-sidecar.workspace = true
tracing-subscriber.workspace = true

# Real reference pull-diagnostics server exercised by tests/reference_e2e.rs
# and its sibling suites; it needs the pull store, so a default-feature
# consumer build skips it instead of failing. [LSP-PULL-SALSA]
[[example]]
name = "diagnostic-reference"
required-features = ["pull"]
