[package]
name = "lspkit-sidecar"
description = "Framed-IPC primitives and lifecycle/health/respawn for out-of-process backends. Pure transport — no backend-specific code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/lspkit-sidecar"
# Lean tarball + force the release-staged (gitignored) LICENSE-MIT in. [SWR-REL-LICENSE]
include = ["src/**/*", "LICENSE-MIT"]

[lints]
workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
rmp-serde.workspace = true

thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The inbound-routing integration drives the real compiled
# `diagnostic-reference --backend` child over OS stdio, so the test runtime
# needs process spawning plus framed IO.
tokio = { workspace = true, features = ["rt", "macros", "process", "io-util"] }
serde_json.workspace = true
tempfile = "3"
