# cargo-deny configuration — supply-chain vulnerability + license gate.
# Enforced in CI by .github/workflows/supply-chain.yml. [SWR-SEC-VULN-GATE]

[advisories]
# Fail the build on any known vulnerability or unmaintained crate.
# Suppressions go in `ignore` and MUST carry a reason + tracking issue.
version = 2
yanked = "deny"
ignore = []

[licenses]
# Only permissive licenses compatible with this workspace's MIT license.
# An unlisted dependency license fails the gate (intentional).
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# `inferno` (the profiler's flame-graph SVG renderer, [PROF-EXPORT-FLAMEGRAPH])
# is CDDL-1.0: file-level copyleft like the MPL-2.0 already allowed above. It is
# used unmodified, so the exception is scoped to that one crate.
exceptions = [
    { allow = ["CDDL-1.0"], crate = "inferno" },
]

[bans]
# Warn on duplicate versions; deny wildcard internal version requirements.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io and the workspace itself; no unknown registries or git remotes.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
