# cargo-deny configuration — supply-chain vulnerability + license gate.
# Enforced in CI by .github/workflows/supply-chain.yml. [SWR-SEC-VULN-GATE]

[advisories]
# Fail the build on any known vulnerability or unmaintained crate.
# Suppressions go in `ignore` and MUST carry a reason + tracking issue.
version = 2
yanked = "deny"
ignore = [
    # `instant` — UNMAINTAINED (not a vulnerability). Pulled transitively via
    # `notify` v7 → `notify-types`; no upstream release drops it yet and there is
    # no safe upgrade. Time helper, no runtime attack surface. Revisit when
    # `notify` migrates off `instant` (upstream tracking: notify-rs/notify).
    { id = "RUSTSEC-2024-0384", reason = "unmaintained instant, transitive via notify; no upgrade available; not a vulnerability" },
    # `paste` — UNMAINTAINED (not a vulnerability). Pulled transitively via
    # `rmcp` (the MCP SDK); build-time proc-macro helper only, no runtime/attack
    # surface, no safe upgrade. Revisit when `rmcp` migrates to `pastey`.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained paste, transitive via rmcp; build-time proc-macro only; no upgrade available; not a vulnerability" },
]

[licenses]
# Only permissive licenses compatible with this workspace's MIT license.
# An unlisted dependency license fails the gate (intentional).
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Warn on duplicate versions; deny wildcard internal version requirements.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io and the workspace itself; no unknown registries or git remotes.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
