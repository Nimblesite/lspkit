<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">lspkit — One engine. Every surface.</title>
  <desc id="d">The lspkit wordmark and headline beside an engineering plate: one vermilion engine routes to two terminal surfaces, LSP and MCP.</desc>
  <!-- [WEB-DESIGN-COLOR] Fieldwork tokens; follows the reader's colour scheme. -->
  <style>
    .bg { fill: #f4f1e9; } .ink { fill: #202720; } .muted { fill: #60665b; }
    .rule { stroke: #c9ccbf; } .grid { stroke: #e3e1d6; } .wire { stroke: #202720; }
    .term { fill: #202720; } .term-text { fill: #f4f1e9; } .core { fill: #e34b31; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #191c19; } .ink { fill: #f4f1e9; } .muted { fill: #b3b9ac; }
      .rule { stroke: #454b41; } .grid { stroke: #232823; } .wire { stroke: #f4f1e9; }
      .term { fill: #f4f1e9; } .term-text { fill: #191c19; }
    }
    text { font-family: Arial, Helvetica, sans-serif; }
    .mono { font-family: SFMono-Regular, Consolas, monospace; font-size: 13px; letter-spacing: 1.3px; }
  </style>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" class="grid" fill="none" stroke-width="1"/></pattern>
  </defs>
  <rect class="bg" width="1280" height="440"/>
  <rect x="760" y="0" width="520" height="440" fill="url(#g)"/>
  <line class="rule" x1="760" y1="0" x2="760" y2="440" stroke-width="1"/>
  <line class="rule" x1="0" y1="392" x2="1280" y2="392" stroke-width="1"/>

  <text class="ink" x="56" y="70" font-size="29" font-weight="800" letter-spacing="-1.7">lspkit</text>
  <text class="muted mono" x="56" y="138">THE LANGUAGE SERVER TOOLKIT</text>
  <text class="ink" x="52" y="232" font-size="92" font-weight="700" letter-spacing="-6">One engine.</text>
  <text class="ink" x="52" y="324" font-size="92" font-weight="700" letter-spacing="-6">Every surface.</text>
  <text class="muted mono" x="56" y="422">RUST · LSP · MCP · PROFILER</text>
  <text class="muted mono" x="1224" y="422" text-anchor="end">FIG. 01 — ONE ENGINE, TWO SURFACES</text>

  <g class="wire" fill="none" stroke-width="2">
    <path d="M940 196H900V120H860"/>
    <path d="M940 236H900V312H860"/>
    <path d="M1100 216H1150"/>
  </g>
  <rect class="core" x="940" y="166" width="160" height="100"/>
  <rect class="wire" x="940" y="166" width="160" height="100" fill="none" stroke-width="2"/>
  <text x="1020" y="224" font-size="20" font-weight="700" text-anchor="middle" fill="#202720">EngineApi</text>
  <rect class="term" x="780" y="88" width="80" height="64"/>
  <text class="term-text mono" x="820" y="125" text-anchor="middle">LSP</text>
  <rect class="term" x="780" y="280" width="80" height="64"/>
  <text class="term-text mono" x="820" y="317" text-anchor="middle">MCP</text>
  <rect class="term" x="1150" y="184" width="96" height="64"/>
  <text class="term-text mono" x="1198" y="221" text-anchor="middle">PROFILE</text>
